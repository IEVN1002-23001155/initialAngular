<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        <div class="form-group pt-4">
                            <label for="num1">Número 1:</label>
                            <input [(ngModel)]="num1" name="num1" type="text" class="form-control" 
                            id="num1" placeholder="Ingrese número 1">
                        </div>
                        <div class="form-group pt-4">
                            <label for="num2">Número 2:</label>
                            <input [(ngModel)]="num2" name="num2" type="text" class="form-control" 
                            id="num2" placeholder="Ingrese número 2">
                        </div>
                        <br>
                        <div class="form-group pt-4">
                            <label>Operación:</label><br>
                                 <input type="radio" name="operacion" value="sumar" [(ngModel)]="operacion"> Sumar- <br>
                                 <input type="radio" name="operacion" value="restar" [(ngModel)]="operacion"> Restar- <br>
                                <input type="radio" name="operacion" value="multiplicar" [(ngModel)]="operacion"> Multiplicar* <br>
                                <input type="radio" name="operacion" value="dividir" [(ngModel)]="operacion"> Dividir/
                                </div>
                        <br>
                        
                        <button (click)="calcular()" type="button" class="btn btn-primary">
                            Calcular
                        </button>

                        <!--
                        <button (click)="sumar()" type="button" class="btn btn-primary">
                            Sumar
                        </button>
                        <button (click)="restar()" type="button" class="btn btn-primary">
                            Resta
                        </button>
                        <button (click)="multiplicar()" type="button" class="btn btn-primary">
                            Multiplicar
                        </button>
                        <button (click)="dividir()" type="button" class="btn btn-primary">
                            Dividir
                        </button> -->
                    </form>
                </div>
                <div class="col-6">
                    <h3>Resultado: {{resultado}} </h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
