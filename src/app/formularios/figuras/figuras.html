<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figuras</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <!-- Primera columna: Formulario -->
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        <div class="form-group pt-4">
                            <label>Elige la figura:</label><br>
                            <input type="radio" name="figura" value="triangulo" [(ngModel)]="figura"> Triángulo <br>
                            <input type="radio" name="figura" value="rectangulo" [(ngModel)]="figura"> Rectángulo <br>
                            <input type="radio" name="figura" value="circulo" [(ngModel)]="figura"> Círculo <br>
                            <input type="radio" name="figura" value="pentagono" [(ngModel)]="figura"> Pentágono
                        </div>

                        <div class="form-group pt-4">
                            <label for="num1">Número 1 (Base / Radio / Perímetro):</label>
                            <input [(ngModel)]="num1" name="num1" type="text" class="form-control" 
                            id="num1" placeholder="Ingrese número 1">
                        </div>
                        
                        <div class="form-group pt-4">
                            <label for="num2">Número 2 (Altura / Apotema):</label>
                            <input [(ngModel)]="num2" name="num2" type="text" class="form-control" 
                            id="num2" placeholder="Ingrese número 2">
                        </div>
                        <br>
                        
                        <button (click)="calcular()" type="button" class="btn btn-primary">
                            Calcular
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="col-6">
                <br>
                <h3>Resultado: {{resultado}} </h3>
            </div>
        </div>
    </div>
</body>
</html>
