<div class="card">
    <div class="card-head">
        <h1>HEROES DRAGON BALL</h1>
        <div class="card-body">
            <div class="row">
                <div class="col-md-2">
                    filtrar por:
                </div>
                <div class="col-md-4">
                    <input [(ngModel)]="listFilter" type="text" class="from-control" placeholder="Ingrese nombre de Heroe">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <h3>filtro:{{listFilter}}</h3>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped"*ngIf="heroes.length>0">
                    <thead>
                        <tr>
                            <th><button (click)="showImage()" class="btn btn-primary">{{muestraImagen?'Ocultar ':'Muestra '}}imagen</button></th>
                            <th>nombre</th>
                            <th>descripcion</th>
                            <th>raza</th>
                            <th>ki</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let heroe of heroes">
                            <td><img *ngIf="muestraImagen" [src]="heroe.imagen" 
                     [style.width.px]="imageWidth" 
                     [style.margin.px]="imageMargin"></td>
                            <td>{{heroe.nombre}}</td>
                            <td>{{heroe.descripcion}}</td>
                            <td>{{heroe.race}}</td>
                            <td>{{heroe.ki}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
